# DRAFT rule catalog for calibration round 3 (not approved, not built).
version: rule_levels_v2_draft
categories:
- counting
- word
- sentence
- position
- markup
- decoration
max_per_category: 2
pool_size: 10
min_per_level: 3
types:
  unique_words:
    category: counting
    source: IFBench count:unique_word_count (100-500)
    param: n
    levels:
      easy: 100
      medium: 160
      hard: 200
    ladder:
    - 60
    - 100
    - 130
    - 160
    - 200
    - 240
    - 300
  conjunctions:
    category: counting
    source: IFBench count:conjunctions (2-6)
    param: n
    levels:
      easy: 2
      medium: 4
      hard: 6
    ladder:
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
  word_repeats:
    category: word
    source: IFBench words:repeats (1-5)
    param: n
    levels:
      easy: 20
      medium: 10
      hard: 5
    ladder:
    - 30
    - 20
    - 15
    - 10
    - 8
    - 5
    - 4
  longest_word:
    category: word
    source: new
    param: n
    levels:
      easy: 12
      medium: 9
      hard: 8
    ladder:
    - 16
    - 14
    - 12
    - 10
    - 9
    - 8
    - 7
  no_consecutive_initial:
    category: word
    source: IFBench words:no_consecutive (whole response)
    param: scope
    levels:
      easy: first_sentence
      medium: first_two_sentences
      hard: first_four_sentences
    ladder:
    - first_sentence
    - first_two_sentences
    - first_four_sentences
    - first_paragraph
    - whole
  longest_sentence:
    category: sentence
    source: new
    param: n
    levels:
      easy: 22
      medium: 18
      hard: 14
    ladder:
    - 40
    - 35
    - 28
    - 22
    - 18
    - 14
    - 12
  questions:
    category: sentence
    source: new
    param: n
    levels:
      easy: 1
      medium: 3
      hard: 6
    ladder:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 8
  title_case:
    category: sentence
    source: IFBench format:title_case (whole response)
    param: scope
    levels:
      easy: first_sentence
      medium: paragraph_first
      hard: whole
    ladder:
    - first_sentence
    - first_two_sentences
    - paragraph_first
    - first_paragraph
    - first_two_paragraphs
    - whole
  keyword_sentence:
    category: position
    source: IFBench sentence:keyword (n 1-20)
    param: n
    needs: keyword
    levels:
      easy: 2
      medium: 5
      hard: 7
    ladder:
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 12
  emoji_ends:
    category: decoration
    source: IFBench format:emoji (every sentence)
    param: scope
    levels:
      easy: last_sentence
      medium: each_paragraph
      hard: every_sentence
    ladder:
    - last_sentence
    - first_and_last_sentence
    - each_paragraph
    - every_sentence
  person_names:
    category: counting
    source: IFBench count:person_names (list of 50 names in the prompt)
    param: n
    levels:
      easy: 3
      medium: 7
      hard: 15
    ladder:
    - 1
    - 2
    - 3
    - 5
    - 7
    - 10
    - 12
    - 15
    reserve: true
  stopword_share:
    category: word
    source: IFBench words:stop_words (percentage, pinned 179-word list)
    param: pct
    levels:
      easy: 50
      medium: 42
      hard: 36
    ladder:
    - 55
    - 50
    - 46
    - 42
    - 39
    - 36
    - 33
    reserve: true
  sentence_increment:
    category: sentence
    source: IFBench sentence:increment (scoped to the first n sentences)
    param: n
    levels:
      easy: 2
      medium: 4
      hard: 5
    ladder:
    - 2
    - 3
    - 4
    - 5
    - 6
    - 8
    reserve: true
  postscript:
    category: position
    source: IFEval detectable_content:postscript (P.S. length levels added)
    param: n
    levels:
      easy: 10
      medium: 45
      hard: 60
    ladder:
    - 1
    - 10
    - 20
    - 30
    - 45
    - 60
    - 80
    reserve: true
  nested_quotes:
    category: markup
    source: IFBench format:quotes (alternating double/single, depth 3)
    param: n
    levels:
      easy: 1
      medium: 2
      hard: 4
    ladder:
    - 1
    - 2
    - 3
    - 4
    reserve: true
  divider_lines:
    category: decoration
    source: new (dividers; scope axis instead of the old 1/2/4 counts)
    param: scope
    levels:
      easy: first_gap
      medium: first_two_gaps
      hard: every_paragraph
    ladder:
    - first_gap
    - first_two_gaps
    - every_paragraph
    - every_sentence
    reserve: true
  bold_first_word:
    category: markup
    source: new (bold sentence starts; scope axis)
    param: scope
    levels:
      easy: first_sentence
      medium: paragraph_first
      hard: every_sentence
    ladder:
    - first_sentence
    - paragraph_first
    - first_two_paragraphs
    - every_sentence
    reserve: true
forbidden_pairs: []
pair_review_note: 'No new pairwise impossibility among the 17 types at any level. Known triple: postscript >= 30/60 words
  x divider_lines every_sentence (P.S. must be one sentence) x longest_sentence: left to the pool-compatibility judge.'
manyifeval_overlap_check: 'Checked 2026-11-28 against src/mife/source.py TYPE_INFO (the 15 ManyIFEval types): no exact overlap.
  Nearest relatives: nested_quotes vs startend:quotation (wrap the whole response in quotes; different check), keyword_sentence
  vs keywords:existence (position-specific vs anywhere), sentence_increment/longest_sentence vs length_constraints:number_sentences
  (sentence lengths vs sentence count). postscript is IFEval detectable_content:postscript, which ManyIFEval does not use.'
status: DRAFT for round 3 (the last adjustment round), proposed 2026-11-28, not approved
frozen_after_round2:
- conjunctions
- word_repeats
- unique_words
- keyword_sentence
- questions
- stopword_share
round2_moves:
  longest_word:
    medium:
      from: 10
      to: 9
  no_consecutive_initial:
    medium:
      from: first_paragraph
      to: first_two_sentences
    hard:
      from: first_two_paragraphs
      to: first_four_sentences
  sentence_increment:
    hard:
      from: 6
      to: 5
  postscript:
    medium:
      from: 30
      to: 45
  person_names:
    hard:
      from: 12
      to: 15
  nested_quotes:
    hard:
      from: 3
      to: 4
  longest_sentence:
    easy:
      from: 28
      to: 22
    medium:
      from: 22
      to: 18
  title_case:
    medium:
      from: first_two_paragraphs
      to: paragraph_first
  emoji_ends:
    medium:
      from: first_and_last_sentence
      to: each_paragraph
  divider_lines:
    medium:
      from: every_paragraph
      to: first_two_gaps
    hard:
      from: every_sentence
      to: every_paragraph
  bold_first_word:
    easy:
      from: paragraph_first
      to: first_sentence
    medium:
      from: first_two_paragraphs
      to: paragraph_first
dropped_round2:
  hashtags:
    easy: 2
    medium: 3
    hard: 6
scope_nesting: 'Scope types: easy is a subset of medium, and medium a subset of hard (a response passing hard also passes
  medium and easy): title_case first sentence < first sentence of every paragraph < whole; no_consecutive_initial first sentence
  < first two sentences < first four sentences (sentence counts, so nesting never depends on paragraph breaks); emoji_ends
  last sentence < last sentence of every paragraph < every sentence; divider_lines first gap < first two gaps < every paragraph
  gap; bold_first_word first sentence < first sentence of every paragraph < every sentence.'
