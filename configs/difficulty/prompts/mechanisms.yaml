# Mechanism definitions shown to the writer (Prompt 2) and the independent judge (Prompt 4).
reasoning: |
  Reasoning mechanism.
  - easy: the answer needs 1 meaningful inference from the supplied information.
  - medium: the answer needs 2 dependent operations; the second builds on the result of the first.
  - hard: the answer needs 3 operations, each building on the previous one.
  An operation can be causal, logical, an event dependency, or a decision derived from the supplied information. Each step must be necessary and not bypassable: no shorter path may lead to the answer. The reasoning stays implicit: never say how many steps there are, never give the chain, and never reveal the conclusion. Keep irrelevant information, domain familiarity and the expected response type roughly constant across the three versions (no distractors are added).
distractors: |
  Distractor mechanism.
  - easy: 0 distractors.
  - medium: 2 distractors; all of easy's relevant information is kept.
  - hard: 4 distractors; all of medium's information and its 2 distractors are kept, word for word, and 2 more are added.
  A distractor is a plausible, natural fact that is unnecessary for the answer and does not change the correct answer. The core instruction, the relevant facts, the reasoning and the expected answer stay unchanged across levels. The answer needs no inference beyond reading the relevant facts.
